<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ficha ACR — Portal GFP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/portal.css?v=20261109j" />
  <script>
    (function () {
      try {
        if (window.self !== window.top) document.documentElement.classList.add("is-embed");
      } catch (e) {
        document.documentElement.classList.add("is-embed");
      }
    })();
  </script>
</head>
<body class="portal-body">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-logos" aria-label="Identidad institucional GFP · SECO · Basel">
        <a class="site-logo-gfp" href="https://www.gfpsubnacional.pe/" target="_blank" rel="noopener noreferrer" title="GFP Subnacional">
          <img src="/assets/img/logo_gfp.png" alt="GFP — Suiza apoyando al Perú" height="48" loading="eager"/>
        </a>
        <img class="site-logo-seco" src="/assets/img/logo_SECO.jpg" alt="Embajada de Suiza en el Perú — SECO" height="42" loading="eager"/>
        <img class="site-logo-basel" src="/assets/img/logo_basel.png" alt="Basel Institute on Governance" height="38" loading="eager"/>
      </div>
    </div>
  </header>
  <div class="portal-menu-band">
    <nav class="portal-hero-nav navbar" aria-label="Navegación del portal">
      <ul class="nav-tabs">
        <li><a href="/"><i class="fas fa-home"></i> Inicio</a></li>
        <li><a href="/mapa"><i class="fas fa-map"></i> Mapa</a></li>
        <li><a href="/datos"><i class="fas fa-database"></i> Datos</a></li>
        <li><a href="/mapa?tab=metodologia"><i class="fas fa-book-open"></i> Metodología</a></li>
        <li><a href="/mapa?tab=tendencias"><i class="fas fa-chart-line"></i> Tendencias</a></li>
        <li><a href="https://www.gfpsubnacional.pe/sistema-de-alertas-tempranas-de-deforestacion/" target="_blank" rel="noopener" title="Alertas Tempranas de Deforestación (acceso con usuario)"><i class="fas fa-satellite"></i> Alertas Tempranas</a></li>
      </ul>
    </nav>
  </div>

  <main class="portal-main">
    <div class="acr-page-wrap">
      <a class="acr-back" href="/"><i class="fas fa-arrow-left"></i> Volver al portal</a>
      <div id="acr-root" class="acr-detail-card">
        <div class="acr-loading"><i class="fas fa-spinner fa-spin"></i> Cargando ficha…</div>
      </div>
    </div>
  </main>

  <footer class="footer-simple">
    <div class="footer-logo"><i class="fas fa-leaf"></i></div>
    <p style="font-style:italic;color:#1a4d2e;font-weight:500">Suiza, apoyando la tecnología al servicio de la conservación de nuestros bosques amazónicos.</p>
  </footer>

  <script src="/assets/js/acr.js?v=20261002a"></script>

</html>
