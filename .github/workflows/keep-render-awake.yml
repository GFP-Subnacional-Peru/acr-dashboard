# Un solo proceso, de lunes a viernes, llama a los dos servicios cada 4 minutos
# hasta las 18:00 de Lima. GitHub no cumple un cron de cada 5 minutos: lo deja
# en cola y el servicio se duerme. Aquí el aviso arranca y se queda.
# 12:50 UTC = 7:50 Lima. 13:20 UTC = 8:20, por si el primero se atrasó.
# 18:20 UTC = 13:20 Lima, para el segundo tramo. Cada tramo dura como máximo 6 horas.
name: Keep Render awake

on:
  schedule:
    - cron: "50 12 * * 1-5"
    - cron: "20 13 * * 1-5"
    - cron: "20 18 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    if: github.repository == 'GFP-Subnacional-Peru/acr-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Mantener dashboard y alertas despiertos hasta las 18
        run: |
          set -u
          while true; do
            hora=$(TZ=America/Lima date +%H)
            hora=$((10#$hora))
            if [ "$hora" -ge 18 ]; then
              echo "18:00 en Lima. Se deja de llamar."
              exit 0
            fi
            marca=$(TZ=America/Lima date +%H:%M)
            for url in \
              "https://acr-dashboard-5iqz.onrender.com/api/health" \
              "https://acr-atd.onrender.com/api/atd/salud"
            do
              code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 180 "$url" || echo "000")
              echo "$marca $url HTTP $code"
            done
            sleep 240
          done
