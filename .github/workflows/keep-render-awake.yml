# Lunes a viernes, 8:00–18:00 hora de Lima (UTC−5).
# 12:50 UTC = 7:50 Lima, para que a las 8 ya esté despierto.
# 13:00–22:55 UTC = 8:00–17:55 Lima. A las 18 se deja de llamar y se apaga solo.
name: Keep Render awake

on:
  schedule:
    - cron: "50,55 12 * * 1-5"
    - cron: "*/5 13-22 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard y alertas
        run: |
          ping_una() {
            local nombre="$1" url="$2"
            local i code
            for i in 1 2 3; do
              code=$(curl -fsS -o /tmp/health.json -w "%{http_code}" --max-time 180 "$url" || echo "000")
              echo "$nombre intento $i — HTTP $code"
              cat /tmp/health.json 2>/dev/null || true
              echo
              if [ "$code" = "200" ]; then return 0; fi
              sleep 15
            done
            return 1
          }
          ok=0
          ping_una "Dashboard" "https://acr-dashboard-5iqz.onrender.com/api/health" || ok=1
          ping_una "Alertas" "https://acr-atd.onrender.com/api/atd/salud" || ok=1
          exit $ok
