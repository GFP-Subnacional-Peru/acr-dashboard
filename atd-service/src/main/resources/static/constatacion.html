<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte sobre constatación de deforestación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
  :root { --verde: #1b5e20; --verde-claro: #e8f5e9; --linea: #d7e3d4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef3ee; color: #1d2b20; font-family: Inter, sans-serif; }
  .hoja { max-width: 980px; margin: 24px auto; background: #fff; border: 1px solid var(--linea); box-shadow: 0 8px 28px rgba(20, 40, 20, .08); }
  header { display: flex; align-items: center; gap: 16px; padding: 16px 22px; border-bottom: 6px solid var(--verde); }
  header img { height: 46px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; color: var(--verde); }
  header p { margin: 2px 0 0; font-size: 12px; color: #4e624f; }
  .cuerpo { display: grid; grid-template-columns: 280px 1fr; gap: 18px; padding: 18px 22px 26px; }
  .ficha { background: var(--verde-claro); border-radius: 12px; padding: 14px; }
  .ficha h2 { margin: 0 0 8px; font-size: 15px; }
  .fila { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #d3e6d4; }
  .fila span { color: #4e624f; }
  .sat { position: relative; min-height: 360px; background: #dfe8df center/cover no-repeat; border-radius: 12px; overflow: hidden; }
  .sat img.fondo { width: 100%; height: 420px; object-fit: cover; display: block; }
  .fotos { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  figure { margin: 0; background: #fff; border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; }
  figure img { width: 100%; max-height: 220px; object-fit: cover; display: block; background: #eee; }
  figcaption { padding: 8px 10px 10px; font-size: 13px; }
  figcaption b { display: block; margin-bottom: 2px; }
  .vacio { padding: 28px 16px; text-align: center; color: #4e624f; font-size: 14px; }
  .pie { padding: 0 22px 18px; font-size: 12px; color: #5d6e5e; }
  @media (max-width: 800px) { .cuerpo { grid-template-columns: 1fr; } }
  @media print { body { background: #fff; } .hoja { margin: 0; box-shadow: none; border: 0; } }
</style>
</head>
<body>
<article class="hoja">
  <header>
    <img src="/img/gfp.png" alt="GFP Subnacional">
    <div>
      <h1>REPORTE SOBRE CONSTATACIÓN DE DEFORESTACIÓN</h1>
      <p id="sub">GFP Subnacional · corroboración en campo</p>
    </div>
  </header>
  <div class="cuerpo">
    <section class="ficha" id="ficha"></section>
    <section>
      <div class="sat" id="sat"></div>
      <div class="fotos" id="fotos"></div>
    </section>
  </div>
  <p class="pie">La foto de campo constata la alerta. No reemplaza el reporte sobre alerta de deforestación ni la clasificación del especialista.</p>
</article>
<script>
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const codigo = new URLSearchParams(location.search).get('codigo') || '';
const fecha = (iso) => (iso ? iso.slice(0, 10).split('-').reverse().join('/') : '–');

async function cargar() {
  if (!/^[A-Z]{3}-\d{4}-\d{4,6}$/.test(codigo)) {
    document.getElementById('ficha').innerHTML = '<p class="vacio">Falta el código de la alerta.</p>';
    return;
  }
  const [det, fotos] = await Promise.all([
    fetch(`/api/atd/alertas/${codigo}`).then((r) => r.json()),
    fetch(`/api/atd/alertas/${codigo}/foto`).then((r) => r.ok ? r.json() : []),
  ]);
  const d = det.properties || {};
  document.title = `Constatación · ${d.codigo || codigo}`;
  document.getElementById('sub').textContent = `${d.acr_nombre || ''} · ${d.region || ''} · ${d.codigo || codigo}`;
  const coord = (d.lat != null && d.lon != null) ? `${Number(d.lat).toFixed(5)}, ${Number(d.lon).toFixed(5)}` : '–';
  document.getElementById('ficha').innerHTML = `
    <h2>${esc(d.codigo_reporte || d.codigo || codigo)}</h2>
    <div class="fila"><span>Alerta</span><b>${esc(d.codigo || codigo)}</b></div>
    <div class="fila"><span>ACR</span><b>${esc(d.acr_nombre || '–')}</b></div>
    <div class="fila"><span>Fecha</span><b>${fecha(d.fecha_imagen)}</b></div>
    <div class="fila"><span>Superficie</span><b>${Number(d.superficie_ha || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ha</b></div>
    <div class="fila"><span>Coordenadas</span><b>${esc(coord)}</b></div>
    <div class="fila"><span>Fotos</span><b>${fotos.length}</b></div>`;
  document.getElementById('sat').innerHTML = `<img class="fondo" alt="Imagen Sentinel posterior" src="/api/atd/alertas/${encodeURIComponent(codigo)}/imagen/despues.png">`;
  document.getElementById('fotos').innerHTML = fotos.length ? fotos.map((f) => {
    const c = (f.lat != null && f.lon != null) ? `${Number(f.lat).toFixed(5)}, ${Number(f.lon).toFixed(5)}` : 'Sin coordenadas';
    return `<figure><img alt="Foto de constatación" src="${esc(f.url)}"><figcaption><b>${esc(f.nota || 'Sin descripción')}</b>${esc(c)}${f.tomada ? ' · ' + esc(f.tomada) : ''}</figcaption></figure>`;
  }).join('') : `<figure><figcaption class="vacio">Esta alerta todavía no tiene foto de campo. Al subirla, aparece aquí con su descripción y sus coordenadas.</figcaption></figure>`;
}
cargar().catch(() => {
  document.getElementById('ficha').innerHTML = '<p class="vacio">No se pudo abrir la constatación.</p>';
});
</script>
</body>
</html>
