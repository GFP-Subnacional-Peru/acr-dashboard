spring:
  application:
    name: atd-service
  datasource:
    url: ${ATD_DB_URL:jdbc:postgresql://localhost:5433/atd}
    username: ${ATD_DB_USER:atd}
    password: ${ATD_DB_PASSWORD:atd_local}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      connection-init-sql: SET search_path = atd, public
  flyway:
    enabled: true
    schemas: atd
    default-schema: atd
    create-schemas: true
  jackson:
    default-property-inclusion: non_null
  main:
    banner-mode: off

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/geo+json
    min-response-size: 2048
  tomcat:
    threads:
      max: 20
  error:
    include-stacktrace: never
    include-message: never

atd:
  reporte:
    responsable: ${ATD_REPORTE_RESPONSABLE:Favio Campos}
    cargo: ${ATD_REPORTE_CARGO:Promotor Ambiental}
    dashboard-url: ${ATD_DASHBOARD_URL:https://acr-dashboard-5iqz.onrender.com/}
  edicion:
    # Sin token configurado la edición de geometrías queda deshabilitada (hasta el inicio de sesión).
    token: ${ATD_EDITOR_TOKEN:}

logging:
  level:
    root: INFO
    org.springframework.web: WARN
